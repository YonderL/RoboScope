# RLinf Spatial override; place in examples/embodiment/config/ of the SmolVLA adapter branch.
# SMOLVLA_SFT_COMPAT_DIR points to the local LeRobot 0.4.4-compatible SFT directory.
# SMOLVLA_PPO_OUTPUT_DIR points to the desired output directory.
defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/patch_syncer@weight_syncer
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 2
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:SMOLVLA_PPO_OUTPUT_DIR}
    project_name: rlinf
    experiment_name: smolvla_sft100k_ppo_spatial
    logger_backends:
    - tensorboard
  max_epochs: 100
  max_steps: 100
  only_eval: false
  val_check_interval: 10
  save_interval: 10
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: EnvGroup
  train:
    state_type: eef
    rotate_images: true
    image_convention: opengl
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 1
    total_num_envs: 20
    max_episode_steps: 280
    max_steps_per_rollout_epoch: 280
    num_steps_wait: 10
    reset_gripper_open: true
    video_cfg:
      save_video: false
  eval:
    state_type: eef
    rotate_images: true
    image_convention: opengl
    init_params:
      camera_heights: 256
      camera_widths: 256
    rollout_epoch: 5
    total_num_envs: 10
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 280
    max_steps_per_rollout_epoch: 280
    group_size: 1
    is_eval: true
    video_cfg:
      save_video: false
    num_steps_wait: 10
    reset_gripper_open: true
    use_ordered_reset_state_ids: true
rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 40
  seed: 42
  enable_offload: true
  optim:
    lr: 1.0e-07
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    gradient_checkpointing: false
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
  model:
    model_type: smolvla
    precision: fp32
    is_lora: false
    model_path: ${oc.env:SMOLVLA_SFT_COMPAT_DIR}
    num_action_chunks: 10
    action_dim: 7
    num_steps: 10
    add_value_head: true
    smolvla:
      vlm_model_path: null
      noise_level: 0.5
      detach_critic_input: true
      value_hidden_sizes:
      - 256
      - 128
      camera_map:
        observation.images.image: main_images
        observation.images.image2: wrist_images
reward:
  use_reward_model: false
critic:
  use_critic_model: false
