[build-system]
requires = ["setuptools>=71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roboscope"
version = "0.1.0"
description = "Reproducible visuomotor policy learning and evaluation on LIBERO"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
report = ["numpy>=1.26,<2.3", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]
dev = ["ruff==0.14.1", "pytest>=8,<10"]

[project.scripts]
roboscope = "roboscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["models: requires LeRobot / PyTorch", "local: requires local archived experiments"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
